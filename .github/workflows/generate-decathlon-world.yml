name: Generate Decathlon worldwide stores

on:
  push:
    branches:
      - tmp-decathlon-data-20260711
    paths:
      - .github/workflows/generate-decathlon-world.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp-decathlon-data-20260711

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests reverse_geocoder pycountry scipy numpy

      - name: Generate CSV
        run: python scripts/generate_decathlon_world.py

      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: decathlon-stores-world
          path: |
            decathlon_stores_world.csv
            decathlon_stores_world_summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decathlon_stores_world.csv decathlon_stores_world_summary.json
          git commit -m "Generate Decathlon worldwide store dataset" || exit 0
          git push origin HEAD:tmp-decathlon-data-20260711
